name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # 让 Claude 能读取 PR 上的 CI 结果
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # 认证：Claude 订阅（Pro / Max）的 OAuth token。
          # 本地执行 `claude setup-token` 生成，存为仓库 secret CLAUDE_CODE_OAUTH_TOKEN。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          #
          # 备选：改用 Anthropic API key（独立按量计费，与订阅额度无关）时，
          # 注释掉上面一行、取消下面一行的注释，并配置 secret ANTHROPIC_API_KEY。
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # 可选：自定义触发词（默认为 @claude）
          # trigger_phrase: "/claude"

          # 可选：把某个用户指派到 issue 时自动触发
          # assignee_trigger: "claude-bot"

          # 可选：约束 Claude 的行为。本项目为 Objective-C / macOS 应用，
          # CI runner 无 Xcode，Claude 只做静态审阅，不需要放开构建类工具。
          # claude_args: |
          #   --max-turns 15
